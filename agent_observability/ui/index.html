<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Observatory</title>
<style>
:root {
  color-scheme: light;
  --page: #f3f3f1; --surface-1: #fcfcfb; --surface-2: #f0efec; --border: #e2e1dc; --grid: #e8e7e3;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7973; --accent: #2a78d6;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7;
  --warn: #c98500; --crit: #c23b3a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #121211; --surface-1: #1a1a19; --surface-2: #262625; --border: #34342f; --grid: #2b2b28;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e85; --accent: #3987e5;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --warn: #e0a020; --crit: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121211; --surface-1: #1a1a19; --surface-2: #262625; --border: #34342f; --grid: #2b2b28;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e85; --accent: #3987e5;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --warn: #e0a020; --crit: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--surface-1); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; padding: 10px 16px; flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
nav a { color: var(--text-secondary); text-decoration: none; padding: 6px 10px; border-radius: 6px; }
nav a.on { background: var(--surface-2); color: var(--text-primary); font-weight: 600; }
.spacer { flex: 1; }
header label, header button { font-size: 12px; color: var(--text-secondary); }
button { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px;
  color: var(--text-primary); cursor: pointer; font: inherit; font-size: 12px; }
main { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h2 { margin: 0 0 2px; font-size: 14px; font-weight: 650; }
.card .sub { color: var(--text-secondary); font-size: 12px; margin-bottom: 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.kpi .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--text-secondary); font-size: 12px; }
.kpi .n { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--text-secondary); font-weight: 600; font-size: 12px; cursor: default; }
th.s { cursor: pointer; } th.s:hover { color: var(--text-primary); }
td.num, th.num { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
.scroll { overflow-x: auto; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text-secondary); }
.badge.bad { color: var(--crit); border-color: var(--crit); }
.badge.warn { color: var(--warn); border-color: var(--warn); }
.badge.ok { color: var(--text-primary); }
.muted { color: var(--text-muted); } .sec { color: var(--text-secondary); }
.barrow { display: grid; grid-template-columns: minmax(120px, 190px) 1fr 200px; gap: 10px; align-items: center; padding: 3px 0; }
.bar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--series-1); border-radius: 5px; }
.gauge { position: relative; height: 14px; background: var(--surface-2); border-radius: 7px; margin: 22px 0 6px; }
.gauge > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series-1); border-radius: 7px; }
.gauge > b { position: absolute; top: -18px; transform: translateX(-50%); font-size: 10px; font-weight: 500; color: var(--text-muted); }
.gauge > u { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 1.5px dashed var(--text-muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-secondary); margin: 6px 0 2px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px;
  background: var(--c); vertical-align: -1px; }
svg text { fill: var(--text-secondary); font-size: 11px; font-family: inherit; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
#tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
  display: none; max-width: 320px; }
#tip .r { display: flex; justify-content: space-between; gap: 14px; } #tip .h { font-weight: 650; margin-bottom: 3px; }
details summary { cursor: pointer; color: var(--text-secondary); }
pre { background: var(--surface-2); padding: 10px; border-radius: 8px; overflow: auto; font-size: 12px; }
.find { border-top: 1px solid var(--border); padding: 8px 0; }
.find:first-child { border-top: 0; }
.find .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.find .why { margin: 4px 0 0; color: var(--text-secondary); font-size: 13px; }
.empty { padding: 40px 16px; text-align: center; color: var(--text-secondary); }
@media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } .barrow { grid-template-columns: 1fr 90px; } .barrow .bar { display: none; } }
#range { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
#range select, #range input { background: var(--surface-2); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font: inherit; }
#range [hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Token Observatory</h1>
  <nav><a href="#/" id="nav-over">Overview</a><a href="#/sessions" id="nav-sess">Sessions</a><a href="#/compare" id="nav-cmp">Compare</a><a href="#/optimizations" id="nav-opt">Before vs After</a></nav>
  <span class="spacer"></span>
  <div id="range" role="group" aria-label="Date filter">
    <select id="period" aria-label="Period"><option value="all">All time</option><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option><option value="custom">Custom</option></select>
    <button id="prev" title="Previous" aria-label="Previous period">‹</button>
    <input type="date" id="d1" aria-label="From"><span id="dto">to</span><input type="date" id="d2" aria-label="To (inclusive)">
    <button id="next" title="Next" aria-label="Next period">›</button>
    <button id="today" title="Jump to the current period">Now</button>
    <span id="rlabel" class="muted"></span>
  </div>
  <label><input type="checkbox" id="live"> Live (5s)</label>
  <button id="theme" title="Toggle theme">Theme: auto</button>
</header>
<main id="app"><div class="empty">Loading…</div></main>
<div id="tip"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n == null ? "–" : Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(2) + "M" : Math.abs(n) >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(Math.round(n));
const int = n => n == null ? "–" : Math.round(n).toLocaleString();
const pct = (x, d = 0) => x == null ? "–" : (x * 100).toFixed(x > 0 && x < 0.01 ? 1 : d) + "%";
const usd = x => x == null ? "–" : "$" + (Math.abs(x) < 1 ? x.toFixed(4) : x.toFixed(2));
const when = t => t ? new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "–";
const KINDS = ["system", "tool_schema", "user", "history", "retrieval", "tool_result", "agent_state"];
const KIND_COLOR = Object.fromEntries(KINDS.map((k, i) => [k, `var(--series-${i + 1})`]));
const RISK_MARK = { low: "● low", medium: "▲ medium", high: "◆ high" };
const state = { sort: { key: "started_at", dir: -1 }, timer: null, period: "all", anchor: new Date(), from: null, to: null };

// ---------------------------------------------------------------- date filter (browser-local time; window is [since, until))
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parseYmd = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
function bounds() {
  const a = startOfDay(state.anchor);
  if (state.period === "day") return [a, addDays(a, 1)];
  if (state.period === "week") { const s = addDays(a, -((a.getDay() + 6) % 7)); return [s, addDays(s, 7)]; }   // Monday-start
  if (state.period === "month") return [new Date(a.getFullYear(), a.getMonth(), 1), new Date(a.getFullYear(), a.getMonth() + 1, 1)];
  if (state.period === "custom") {
    const f = state.from && parseYmd(state.from), t = state.to && parseYmd(state.to);
    return [f || null, t ? addDays(t, 1) : null];
  }
  return [null, null];
}
function qs() {
  const [a, b] = bounds(), q = [];
  if (a) q.push("since=" + a.getTime() / 1000);
  if (b) q.push("until=" + b.getTime() / 1000);
  return q.length ? "?" + q.join("&") : "";
}
function rangeLabel() {
  const [a, b] = bounds(), f = d => d.toLocaleDateString([], { year: "numeric", month: "short", day: "numeric" });
  if (!a && !b) return state.period === "all" ? "" : "open range";
  if (state.period === "day") return f(a);
  if (state.period === "month") return a.toLocaleDateString([], { year: "numeric", month: "long" });
  return `${a ? f(a) : "…"} – ${b ? f(addDays(b, -1)) : "…"}`;
}
function saveRange() { try { sessionStorage.setItem("obs_range", JSON.stringify({ p: state.period, a: +state.anchor, f: state.from, t: state.to })); } catch (e) { } }
function syncRangeUi() {
  const p = state.period, nav = p === "day" || p === "week" || p === "month";
  $("#period").value = p;
  $("#prev").hidden = $("#next").hidden = $("#today").hidden = !nav;
  $("#d1").hidden = $("#d2").hidden = $("#dto").hidden = p !== "custom";
  $("#d1").value = state.from || ""; $("#d2").value = state.to || "";
  $("#rlabel").textContent = rangeLabel();
}
function step(dir) {
  const a = state.anchor, p = state.period;
  state.anchor = p === "day" ? addDays(a, dir) : p === "week" ? addDays(a, 7 * dir) : new Date(a.getFullYear(), a.getMonth() + dir, 1);
}
function setPeriod(p) {
  if (p === "custom" && !state.from && !state.to) { const [a, b] = bounds(); if (a) { state.from = ymd(a); state.to = ymd(addDays(b, -1)); } }
  state.period = p; saveRange(); syncRangeUi(); render();
}
$("#period").onchange = e => setPeriod(e.target.value);
$("#prev").onclick = () => { step(-1); saveRange(); syncRangeUi(); render(); };
$("#next").onclick = () => { step(1); saveRange(); syncRangeUi(); render(); };
$("#today").onclick = () => { state.anchor = new Date(); saveRange(); syncRangeUi(); render(); };
$("#d1").onchange = e => { state.from = e.target.value || null; saveRange(); syncRangeUi(); render(); };
$("#d2").onchange = e => { state.to = e.target.value || null; saveRange(); syncRangeUi(); render(); };
try { const r = JSON.parse(sessionStorage.getItem("obs_range") || "null"); if (r) { state.period = r.p; state.anchor = new Date(r.a); state.from = r.f; state.to = r.t; } } catch (e) { }


// ---------------------------------------------------------------- data
function tok() { try { return sessionStorage.getItem('obs_token') || ''; } catch (e) { return ''; } }
async function api(p) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const t = tok();
    const r = await fetch(p, t ? { headers: { Authorization: 'Bearer ' + t } } : {});
    if (r.status === 401 || r.status === 403) {
      const v = window.prompt('This server requires an access token (read scope):', '');
      if (!v) throw new Error('access token required');
      try { sessionStorage.setItem('obs_token', v.trim()); } catch (e) {}
      continue;
    }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    return r.json();
  }
  throw new Error('access denied');
}

// ---------------------------------------------------------------- tooltip
const tip = $("#tip");
function showTip(ev, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - w - 8) + "px";
  tip.style.top = Math.min(ev.clientY + 14, innerHeight - h - 8) + "px";
}
const hideTip = () => tip.style.display = "none";
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mousemove", e => showTip(e, el.dataset.tip));
    el.addEventListener("mouseleave", hideTip);
  });
}

// ---------------------------------------------------------------- charts
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }

function stacked(cats, series, { height = 250, ytitle = "tokens" } = {}) {
  const W = 860, H = height, m = { l: 48, r: 12, t: 10, b: 28 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const totals = cats.map((_, i) => series.reduce((s, x) => s + (x.values[i] || 0), 0));
  const max = niceMax(Math.max(...totals, 1)), bw = Math.min(46, pw / cats.length * 0.72), step = pw / cats.length;
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const y = m.t + ph - ph * i / 4;
    g += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text x="${m.l - 6}" y="${y + 4}" text-anchor="end">${fmt(max * i / 4)}</text>`;
  }
  cats.forEach((c, i) => {
    const x = m.l + step * i + (step - bw) / 2; let y = m.t + ph;
    const rows = series.filter(s => s.values[i]).map(s => `<div class="r"><span>${esc(s.label)}</span><b>${int(s.values[i])}</b></div>`).join("");
    const tp = `<div class="h">${esc(c)}</div>${rows}<div class="r"><span>total</span><b>${int(totals[i])}</b></div>`;
    g += `<g data-tip='${tp.replace(/'/g, "&#39;")}'><rect x="${m.l + step * i}" y="${m.t}" width="${step}" height="${ph}" fill="transparent"/>`;
    series.forEach(s => {
      const v = s.values[i] || 0; if (!v) return;
      const h = v / max * ph; y -= h;
      g += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, 0.5)}" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"/>`;
    });
    g += `</g>`;
    if (cats.length <= 24 || i % Math.ceil(cats.length / 24) === 0) g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(c.length > 6 ? c.slice(0, 6) : c)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Stacked bars of ${esc(ytitle)}">${g}</svg>`;
}

function lineChart(points, hlines, { height = 240, limit } = {}) {
  const W = 860, H = height, m = { l: 48, r: 96, t: 12, b: 28 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const ymax = limit ? limit * 1.02 : niceMax(Math.max(...points.map(p => p.y), 1)), X = i => m.l + (points.length > 1 ? pw * i / (points.length - 1) : pw / 2), Y = v => m.t + ph - v / ymax * ph;
  let g = "";
  for (let i = 0; i <= 4; i++) { const y = m.t + ph - ph * i / 4; g += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text x="${m.l - 6}" y="${y + 4}" text-anchor="end">${fmt(ymax * i / 4)}</text>`; }
  hlines.forEach(h => { const y = Y(h.y); g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="${h.color || "var(--text-muted)"}" stroke-dasharray="${h.solid ? "" : "4 4"}" stroke-width="1.2"/><text x="${W - m.r + 6}" y="${y + 4}">${esc(h.label)}</text>`; });
  if (points.length) g += `<polyline fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" points="${points.map((p, i) => X(i) + "," + Y(p.y)).join(" ")}"/>`;
  points.forEach((p, i) => {
    g += `<g data-tip='${p.tip.replace(/'/g, "&#39;")}'><rect x="${X(i) - 12}" y="${m.t}" width="24" height="${ph}" fill="transparent"/><circle cx="${X(i)}" cy="${Y(p.y)}" r="4" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/></g>`;
    if (points.length <= 24 || i % Math.ceil(points.length / 24) === 0) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(p.x)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative tokens against budget">${g}</svg>`;
}

const legend = ks => `<div class="legend">${ks.map(k => `<span style="--c:${KIND_COLOR[k]}">${k}</span>`).join("")}</div>`;
const tile = (v, l, n = "") => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div>${n ? `<div class="n">${n}</div>` : ""}</div>`;
function barList(rows, { fmtv = fmt } = {}) {
  const max = Math.max(...rows.map(r => r.value), 1);
  return rows.map(r => `<div class="barrow" ${r.tip ? `data-tip='${r.tip.replace(/'/g, "&#39;")}'` : ""}><span>${esc(r.label)}</span><div class="bar"><i style="width:${r.value / max * 100}%"></i></div><span class="sec" style="text-align:right">${fmtv(r.value)}${r.extra ? ` · ${r.extra}` : ""}</span></div>`).join("");
}
function statusBadge(s) { const c = s === "completed" ? "ok" : s === "budget_exhausted" ? "bad" : s === "failed" ? "warn" : ""; return `<span class="badge ${c}">${esc(s || "open")}</span>`; }

// ---------------------------------------------------------------- overview
async function compareView() {
  const c = await api("/api/compare");
  if (!c.cohorts.length) return `<div class="card empty">No cohorts tagged yet. Run <code>python3 -m agent_observability compare-tag --db ledger.db --cohort ID --arm with_agents|inline --label TEXT --units N --sessions ROOT_SESSION_ID</code>.</div>`;
  const A = c.arms.with_agents, B = c.arms.inline, d = c.delta_agents_vs_inline || {};
  const dl = v => v == null ? "n/a" : (v > 0 ? "+" : "") + (v * 100).toFixed(0) + "% vs inline";
  const row = (lab, k, f) => `<tr><td>${lab}</td><td class="num">${A.per_unit ? f(A.per_unit[k]) : "n/a"}</td><td class="num">${B.per_unit ? f(B.per_unit[k]) : "n/a"}</td><td class="num">${dl(d[k])}</td></tr>`;
  return `
  <div class="kpis">
    ${tile(A.per_unit ? usd(A.per_unit.est_cost) : "n/a", "With agents, per " + esc(c.cohorts[0].unit_label), dl(d.est_cost))}
    ${tile(B.per_unit ? usd(B.per_unit.est_cost) : "n/a", "Inline, per " + esc(c.cohorts[0].unit_label), `${B.units} units over ${B.cohorts} cohorts`)}
    ${tile(A.per_unit ? fmt(A.per_unit.billed) : "n/a", "Billed tokens / unit (agents)", dl(d.billed))}
    ${tile(B.per_unit ? fmt(B.per_unit.billed) : "n/a", "Billed tokens / unit (inline)", "")}
  </div>
  <div class="card"><h2>Per work unit</h2><div class="sub">Cost basis: ${esc(c.price_basis)}. Billed = fresh + cache read + cache write + output.</div>
    <table><thead><tr><th></th><th class="num">With agents</th><th class="num">Inline</th><th class="num">Delta</th></tr></thead><tbody>
    ${row("Model calls", "calls", x => x.toFixed(1))}${row("Output tokens", "output", fmt)}${row("Cache-read tokens", "cache_read", fmt)}${row("Billed tokens", "billed", fmt)}${row("Est. cost", "est_cost", usd)}
    </tbody></table></div>
  <div class="card"><h2>Cohorts</h2><div class="scroll"><table><thead><tr><th>Cohort</th><th>Arm</th><th class="num">Units</th><th class="num">Calls</th><th class="num">Subagent calls</th><th class="num">Output</th><th class="num">Cache read</th><th class="num">Est. cost</th><th class="num">Cost / unit</th></tr></thead><tbody>

}
function routingTable(rows) {
  return `<table><thead><tr><th>Task</th><th>Type</th><th>Chosen</th><th>Reason</th><th>Assessment</th><th class="num">Failure-driven spend</th><th>Cheaper alternatives</th></tr></thead><tbody>` + rows.map(r =>
    `<tr><td>${esc(r.task_id)}</td><td>${esc(r.task_type)} / ${esc(r.complexity)}</td><td>${esc(r.chosen)}</td><td>${esc(r.reason_code || "–")}</td><td><span class="badge ${r.appropriateness.startsWith("under") ? "warn" : ""}">${esc(r.appropriateness.replaceAll("_", " "))}</span></td><td class="num">${int(r.failure_driven_spend_tokens)}</td><td>${r.cheaper_alternatives.map(a => `${esc(a.alternative)}: <span class="badge">${esc(a.verdict.replaceAll("_", " "))}</span>`).join("<br>") || "–"}</td></tr>`).join("") + `</tbody></table>`;
}

// ---------------------------------------------------------------- router
async function render() {
  const h = location.hash || "#/", app = $("#app");
  $("#nav-over").classList.toggle("on", h === "#/" || h === "");
  $("#nav-sess").classList.toggle("on", h.startsWith("#/sess"));
  $("#nav-cmp").classList.toggle("on", h.startsWith("#/compare"));
  $("#nav-opt").classList.toggle("on", h.startsWith("#/opt"));
  try {
    let html;
    if (h.startsWith("#/session/")) html = await sessionView(decodeURIComponent(h.slice(10)));
    else if (h.startsWith("#/sessions")) html = await sessions();
    else if (h.startsWith("#/opt")) html = await optView();
    else if (h.startsWith("#/compare")) html = await compareView();
    else html = await overview();
    app.innerHTML = html;
    bindTips(app);
    app.querySelectorAll("[data-go]").forEach(tr => tr.onclick = () => location.hash = "#/session/" + encodeURIComponent(tr.dataset.go));
    app.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => { const k = th.dataset.sort; state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : -1 }; render(); });
  } catch (e) { app.innerHTML = `<div class="card empty">Could not load data: ${esc(e.message)}</div>`; }
}
addEventListener("hashchange", render);
$("#live").onchange = e => { clearInterval(state.timer); if (e.target.checked) state.timer = setInterval(() => { if (!document.hidden) { const y = scrollY; render().then(() => scrollTo(0, y)); } }, 5000); };
const themes = ["auto", "light", "dark"];
function applyTheme(t) { try { localStorage.setItem("theme", t); } catch (e) { } if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); $("#theme").textContent = "Theme: " + t; }
$("#theme").onclick = () => applyTheme(themes[(themes.indexOf($("#theme").textContent.slice(7)) + 1) % 3]);
let saved = "auto"; try { saved = localStorage.getItem("theme") || "auto"; } catch (e) { }
applyTheme(saved); syncRangeUi(); render();
</script>
</body>
</html>
