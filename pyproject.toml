[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-observability"
version = "0.1.0"
description = "Token ledger, hard session budget, and deterministic waste/routing analysis for AI agents"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["agent_observability"]

[tool.setuptools.package-data]
agent_observability = ["ui/*.html"]
